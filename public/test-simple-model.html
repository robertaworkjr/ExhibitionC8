<!DOCTYPE html>
<html>
<head>
    <title>Test Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 400px;
            height: 400px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Test GLB Model Loading</h1>
    <model-viewer
        src="/3DObjects/CharlesWooten.glb"
        alt="Charles Wooten Test"
        camera-controls
        auto-rotate
    ></model-viewer>
    
    <script>
        const modelViewer = document.querySelector('model-viewer');
        
        modelViewer.addEventListener('load', () => {
            console.log('✅ Model loaded successfully');
        });
        
        modelViewer.addEventListener('error', (event) => {
            console.error('❌ Model failed to load:', event);
        });
        
        // Check file accessibility
        fetch('/3DObjects/CharlesWooten.glb')
            .then(response => {
                console.log('File fetch status:', response.status);
                console.log('Content-Type:', response.headers.get('content-type'));
                console.log('Content-Length:', response.headers.get('content-length'));
            })
            .catch(error => {
                console.error('File fetch failed:', error);
            });
    </script>
</body>
</html>
