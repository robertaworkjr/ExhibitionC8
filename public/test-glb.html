<!DOCTYPE html>
<html>
<head>
    <title>GLB Test</title>
    <style>
        body { margin: 0; background: #333; color: white; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; }
    </style>
</head>
<body>
    <div id="info">
        <p>Testing GLB loading...</p>
        <button onclick="testLoad()">Test Load GLB</button>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add some lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);

        camera.position.z = 5;

        // Add a test cube
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        function testLoad() {
            console.log("Testing GLB load...");
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                '3DObjects/GallerySpace.glb',
                function (gltf) {
                    console.log('GLB loaded successfully:', gltf);
                    scene.add(gltf.scene);
                    
                    // Center the model
                    const box = new THREE.Box3().setFromObject(gltf.scene);
                    const center = box.getCenter(new THREE.Vector3());
                    gltf.scene.position.sub(center);
                    
                    // Adjust camera
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    camera.position.z = maxDim * 2;
                    
                    document.getElementById('info').innerHTML = '<p>GLB loaded successfully!</p>';
                },
                function (progress) {
                    console.log('Loading progress:', progress);
                },
                function (error) {
                    console.error('GLB loading error:', error);
                    document.getElementById('info').innerHTML = '<p>Error loading GLB: ' + error.message + '</p>';
                }
            );
        }

        // Auto-test
        setTimeout(testLoad, 1000);
    </script>
</body>
</html>
